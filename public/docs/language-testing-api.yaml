          type: string
          format: date-time
          nullable: true
    StartTestResponse:
      type: object
      required: [session_id, test, questions]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        session_id:
          type: string
          format: uuid
        test_id:
          type: integer
        test:
          $ref: '#/components/schemas/Test'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionPublic'
    QuestionAnswerSubmission:
      type: object
      required: [question_id]
