        iin:
          type: string
          nullable: true
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        answers:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/QuestionAnswerSubmission'
    SubmitResponse:
      type: object
      required: [result_id, score, percentage, correct_answers, total_questions, passed, completed_at]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        result_id:
          type: integer
        score:
          type: integer
        percentage:
          type: number
