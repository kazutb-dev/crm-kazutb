            $ref: '#/components/schemas/Test'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        request_id:
          $ref: '#/components/schemas/RequestId'
    SingleTestResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Test'
        request_id:
          $ref: '#/components/schemas/RequestId'
    QuestionListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QuestionAdmin'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        request_id:
          $ref: '#/components/schemas/RequestId'
    SingleQuestionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/QuestionAdmin'
        request_id:
          $ref: '#/components/schemas/RequestId'
    StatisticsListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StatisticsRecord'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
        request_id:
          $ref: '#/components/schemas/RequestId'
    SingleStatisticsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StatisticsRecord'
        request_id:
          $ref: '#/components/schemas/RequestId'
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
        request_id:
          $ref: '#/components/schemas/RequestId'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                message: Bad request.
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            unauthorized:
              value:
                message: Unauthorized.
                errors:
                  authorization:
                    - Valid CRM Bearer token or integration API key is required.
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                message: Only CRM consumers can access this endpoint.
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notFound:
              value:
                message: Resource not found.
    ValidationError:
      description: Validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          examples:
            validation:
              value:
                message: The given data was invalid.
                errors:
                  answers:
                    - Один из переданных ответов не принадлежит текущей сессии.
    InternalServerError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                message: Internal Server Error.
