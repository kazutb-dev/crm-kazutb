        api_version:
          type: string
        database:
          type: string
        queue:
          type: string
        storage:
          type: string
        configuration:
          type: string
          enum: [configured, missing_credentials]
        language_testing_module:
          type: string
        timestamp:
          type: string
          format: date-time
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/HealthRecord'
        request_id:
          $ref: '#/components/schemas/RequestId'
