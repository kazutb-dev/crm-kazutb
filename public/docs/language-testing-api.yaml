    StatisticsRecord:
      type: object
      required: [id, first_name, last_name, email, language, test_name, correct_answers, total_questions, score, percentage, passed, completed_at]
      properties:
        id:
          type: integer
        student_id:
          type: string
          nullable: true
        iin:
          type: string
          nullable: true
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        language:
          type: string
        language_label:
          type: string
        test_name:
          type: string
        correct_answers:
          type: integer
        total_questions:
          type: integer
        score:
          type: integer
        percentage:
          type: number
          format: float
        passed:
          type: boolean
        status:
          type: string
        status_label:
          type: string
        completed_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
    TestUpsertRequest:
      type: object
      required: [name, language, passing_score, total_questions, status]
      properties:
        name:
          type: string
        language:
          type: string
          enum: [english, russian, kazakh]
        description:
          type: string
          nullable: true
        passing_score:
          type: integer
          minimum: 1
          maximum: 100
        total_questions:
          type: integer
          minimum: 1
          maximum: 500
        status:
          type: string
          enum: [active, inactive]
    QuestionOptionRequest:
      type: object
      required: [text, is_correct]
      properties:
        text:
          type: string
        is_correct:
          type: boolean
    QuestionUpsertRequest:
      type: object
      required: [question, points, options]
      properties:
        question:
          type: string
        points:
          type: integer
          minimum: 1
          maximum: 100
        sort_order:
          type: integer
          nullable: true
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: '#/components/schemas/QuestionOptionRequest'
    HealthRecord:
      type: object
      required: [status, api_version, database, queue, storage, configuration, language_testing_module, timestamp]
      properties:
        status:
