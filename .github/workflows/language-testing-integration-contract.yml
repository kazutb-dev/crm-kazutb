name: Language Testing Integration Contract

on:
  push:
    paths:
      - 'app/Modules/LanguageTestingModule/**'
      - 'config/language_testing_module.php'
      - 'database/migrations/**'
      - 'docs/modules/language-testing-ai-students-api.yaml'
      - 'public/docs/language-testing-api.yaml'
      - 'tests/Feature/LanguageTestingModule/**'
      - '.github/workflows/language-testing-integration-contract.yml'
  pull_request:
    paths:
      - 'app/Modules/LanguageTestingModule/**'
      - 'config/language_testing_module.php'
      - 'database/migrations/**'
      - 'docs/modules/language-testing-ai-students-api.yaml'
      - 'public/docs/language-testing-api.yaml'
      - 'tests/Feature/LanguageTestingModule/**'
      - '.github/workflows/language-testing-integration-contract.yml'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: laravel_react_test
          MYSQL_USER: laravel_user
          MYSQL_PASSWORD: laravel_pass
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare testing environment
        run: |
          cp .env.testing .env
          php artisan key:generate --force
          php artisan migrate --force
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_react_test
          DB_USERNAME: laravel_user
          DB_PASSWORD: laravel_pass

      - name: Run v1 integration feature tests
        run: php artisan test tests/Feature/LanguageTestingModule/LanguageTestingIntegrationApiTest.php tests/Feature/LanguageTestingModule/LanguageTestingIntegrationApiContractTest.php
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravel_react_test
          DB_USERNAME: laravel_user
          DB_PASSWORD: laravel_pass
